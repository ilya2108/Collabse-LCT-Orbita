# Дев-стенд «Орбита ФСП»: postgres + keycloak (realm fsp) + mailpit + migrate + backend
# (hot-reload) [+ frontend по профилю full]. Окружение: deploy/compose/.env (`make dev-env`).
#
# Фронтенд в dev обычно запускается на хосте: cd frontend && npm run dev
# (порт 5173, прокси /api → localhost:8000); контейнерный фронт (nginx, порт 3000) —
# по профилю: docker compose --profile full up (make dev-full).
# Все порты публикуются только на 127.0.0.1: dev-стенд с консолью Keycloak, Mailpit без
# пароля и PostgreSQL не должен быть виден соседям по сети (хакатон, кафе).
# Только инфраструктура для backend на хосте: make dev-infra (postgres + keycloak + mailpit).
# Прод-стенд (Caddy, *.nip.io, Mailpit за basic-auth) — отдельный файл (день 7).

name: fsp-dev

# переменные backend'а общие для сервисов backend и migrate (контракт — CLAUDE.md «Env backend»)
x-backend-env: &backend-env
  APP_ENV: dev
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fsp}:${POSTGRES_PASSWORD:-fsp}@postgres:5432/fsp
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080
  # браузер и backend видят Keycloak на localhost:8080 — iss токенов совпадает
  KEYCLOAK_ISSUER: http://localhost:8080/realms/fsp
  KEYCLOAK_REALM: fsp
  KEYCLOAK_AUDIENCES: account,fsp-frontend
  KEYCLOAK_ADMIN_CLIENT_ID: fsp-backend-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET:-}
  PII_FERNET_KEYS: ${PII_FERNET_KEYS:?run make dev-env}
  PII_HMAC_KEY: ${PII_HMAC_KEY:?run make dev-env}
  INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
  FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
  LLM_PROVIDER: ${LLM_PROVIDER:-stub}
  GIGACHAT_CREDENTIALS: ${GIGACHAT_CREDENTIALS:-}
  GIGACHAT_SCOPE: ${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
  GIGACHAT_MODEL_STRONG: ${GIGACHAT_MODEL_STRONG:-GigaChat-2-Pro}
  GIGACHAT_MODEL_FAST: ${GIGACHAT_MODEL_FAST:-GigaChat-2-Lite}
  GIGACHAT_CA_BUNDLE: ${GIGACHAT_CA_BUNDLE:-}
  GIGACHAT_VERIFY_SSL_CERTS: ${GIGACHAT_VERIFY_SSL_CERTS:-true}
  YC_FOLDER_ID: ${YC_FOLDER_ID:-}
  YC_API_KEY: ${YC_API_KEY:-}
  YANDEX_MODEL: ${YANDEX_MODEL:-yandexgpt}
  LLM_DAILY_TOKEN_CAP: ${LLM_DAILY_TOKEN_CAP:-2000000}
  LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-4}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
  SKILLS_DIR: app/skills
  TEST_DEMO_MODE: ${TEST_DEMO_MODE:-false}
  DEMO_COOLDOWN_SECONDS: ${DEMO_COOLDOWN_SECONDS:-300}
  GRADE_COOLDOWN_DAYS: ${GRADE_COOLDOWN_DAYS:-90}
  # телеграм-бот: stub — без сети и токена (исходящие в tg_outbox), polling — реальный бот
  TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-stub}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-OrbitaFspBot}

# dev-стадия образа backend: venv в /opt/venv, код монтируется с хоста (hot-reload)
x-backend-build: &backend-build
  context: ../../backend
  target: dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fsp
      POSTGRES_USER: ${POSTGRES_USER:-fsp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro # 01-init.sql: CREATE DATABASE keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d fsp"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    # entrypoint-обёртка: KC 26 сам НЕ подставляет ${env.*} в realm при импорте
    entrypoint: ["/bin/bash", "/realm-src/import-realm.sh"]
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-fsp}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-fsp}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?run make dev-env}
      KC_HTTP_PORT: "8080"
      # подстановка ${env.*} в realm-fsp.json при импорте (import-realm.sh)
      BACKEND_ADMIN_CLIENT_SECRET: ${BACKEND_ADMIN_CLIENT_SECRET:?run make dev-env}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:?run make dev-env}
      FRONTEND_PUBLIC_URL: ${FRONTEND_PUBLIC_URL:-http://localhost:5173}
    # 8080 — HTTP (консоль admin/${KC_ADMIN_PASSWORD}); mgmt-порт 9000 наружу не нужен
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ../keycloak/realm-fsp.json:/realm-src/realm-fsp.json:ro
      - ../keycloak/import-realm.sh:/realm-src/import-realm.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
      mailpit: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 10s
      timeout: 5s
      retries: 30

  # «Почта стенда»: письма подтверждения email и сброса пароля (UI http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.31
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # миграции Alembic: одноразовый запуск перед backend (тот же образ, идемпотентен)
  migrate:
    build: *backend-build
    image: fsp-backend:dev
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    volumes: [../../backend:/app]
    depends_on:
      postgres: {condition: service_healthy}

  backend:
    build: *backend-build
    image: fsp-backend:dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment: *backend-env
    volumes: [../../backend:/app] # hot-reload
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      # /readyz отвечает 503 без PostgreSQL; curl в образе нет — python stdlib
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # телеграм-бот «ФСП.Орбита» (профиль full): stub-режим работает без токена —
  # исходящие сообщения видны в таблице tg_outbox и в GET /internal/tgbot/outbox
  bot:
    profiles: [full]
    build: *backend-build
    image: fsp-backend:dev
    command: ["python", "-m", "app.tools.bot"]
    environment: *backend-env
    volumes: [../../backend:/app]
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  # полный фронт в контейнере (nginx, прокси /api → backend:8000) — по требованию: --profile full
  frontend:
    profiles: [full]
    build: {context: ../../frontend}
    environment:
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: fsp
      KEYCLOAK_CLIENT_ID: fsp-frontend
      API_BASE: /api
    ports: ["127.0.0.1:3000:8080"]
    depends_on: [backend]

volumes:
  pgdata:
