# nginx фронтенда «Орбита ФСП»: non-root (uid 101) слушает 8080; на хост — 3000 (compose,
# профиль full), на VPS — за Caddy (TLS). Статика SPA + прокси /api → backend:8000.
#
# Файл — шаблон (/etc/nginx/templates/default.conf.template): штатный entrypoint образа nginx
# при старте подставляет ${KEYCLOAK_URL} — и только его (NGINX_ENVSUBST_FILTER в Dockerfile),
# остальные $переменные — nginx. Адрес Keycloak нужен Content-Security-Policy: keycloak-js
# ходит за токеном fetch'ем (connect-src) и грузит silent check-sso в iframe (frame-src).
#
# Топология прод-стенда: Caddy → nginx → backend. X-Forwarded-For передаётся как пришёл
# от Caddy, без дописывания своего соседа: backend (core/audit.client_ip) при TRUSTED_PROXY
# берёт ПОСЛЕДНИЙ элемент цепочки — адрес клиента, который увидел доверенный край.
# Если nginx сам окажется краем, backend заголовку не доверяет (dev: TRUSTED_PROXY=false).
server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # встроенный DNS Docker: имя backend разрешается лениво (через переменную) —
    # nginx стартует и тогда, когда backend ещё не поднялся
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # PDF-резюме кандидата (POST /candidates/me/resume) — до 10 МБ
    client_max_body_size 10m;

    # Заголовки безопасности (always — и на ответы с ошибкой). Внимание: location со своим
    # add_header (config.js, assets, healthz) их не наследует — там отдаются не HTML-документы.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP: скрипты и шрифты только свои (inline-скриптов в SPA нет, silent-check-sso.js — файл);
    # inline-стили нужны motion/ECharts/sonner; Keycloak — connect-src/frame-src;
    # frame-ancestors 'self' — защита от clickjacking чужими сайтами; 'self' обязателен:
    # silent check-sso Keycloak загружает silent-check-sso.html в iframe нашего же origin
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ${KEYCLOAK_URL}; frame-src 'self' ${KEYCLOAK_URL}; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self' ${KEYCLOAK_URL}" always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    # рантайм-конфиг (docker-entrypoint.d/40-config-js.sh): window.__ENV__ = {...}
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # Служебные ручки (джобы, импорт, демо-сброс) через публичный фронт недоступны:
    # их зовут напрямую на backend:8000 по внутренней сети с X-Internal-Token.
    # Регулярный location имеет приоритет над префиксным /api/.
    location ~ ^/api/v1/(internal|assessment/internal)(/|$) {
        return 404;
    }

    # Swagger UI (/api/v1/docs): бандл и стили грузятся с cdn.jsdelivr.net, инициализация —
    # инлайн-скриптом FastAPI, favicon — с fastapi.tiangolo.com. Общая CSP их режет (белая
    # страница), поэтому у документации своя, ослабленная ТОЛЬКО на этом пути. add_header в
    # location отменяет серверные — критичные заголовки продублированы.
    location ^~ /api/v1/docs {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: https://fastapi.tiangolo.com; connect-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
    }

    # API → backend: префикс /api/v1 совпадает, rewrite не нужен; X-Request-Id проходит насквозь
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # разбор потребности и грейдинг открытых ответов ходят в LLM (GigaChat, 1 поток):
        # finish сессии senior — несколько текстовых ответов подряд, ждём до 5 минут
        proxy_read_timeout 300s;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA-фолбэк
    # index.html без кэша: SPA-бандл обновляется на стенде, браузер не должен залипать
    # на старой версии (expires — не add_header: CSP и security-заголовки наследуются).
    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
