<!-- Нейтральный знак-заглушка «Орбиты»: графитовая плашка брендбука ФСП, орбита-кольцо
     и узел. Палитра — брендбук (графит #1B1C21, лаванда #8F94E3, синий #402FFF,
     красный #EC1D35); сам логотип ФСП здесь не используется. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="8" fill="#1B1C21"/>
  <ellipse cx="16" cy="16" rx="10.5" ry="5.5" fill="none" stroke="#8F94E3" stroke-width="2" transform="rotate(-28 16 16)"/>
  <circle cx="16" cy="16" r="4" fill="#FFFFFF"/>
  <circle cx="24.5" cy="10.5" r="3" fill="#EC1D35"/>
</svg>
