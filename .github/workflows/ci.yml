# CI «Орбита ФСП»: ruff + pytest (backend), tsc + build (frontend), gitleaks, compose config,
# сборка образов. Все проверки идут без Keycloak/PostgreSQL/ключей LLM (LLM_PROVIDER=stub).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend — ruff и pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Зависимости
        run: pip install -e ".[dev]"
      - name: Линтер и форматирование
        run: |
          ruff check app tests
          ruff format --check app tests
      - name: Тесты
        run: pytest -q

  frontend:
    name: Frontend — tsc и сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # пока фронт не создан (нет package-lock.json) — шаги пропускаются, job зелёный
      - name: Наличие проекта
        id: present
        run: echo "ok=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.present.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Зависимости
        if: steps.present.outputs.ok == 'true'
        run: npm ci
      - name: Проверка типов
        if: steps.present.outputs.ok == 'true'
        run: npx tsc --noEmit
      - name: Сборка
        if: steps.present.outputs.ok == 'true'
        run: npm run build
      - name: Пропуск
        if: steps.present.outputs.ok != 'true'
        run: echo "frontend/package-lock.json нет — проверка интерфейса пропущена"

  gitleaks:
    name: Секреты — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # сканируется вся история коммитов
      # CLI вместо gitleaks-action: action на push сканирует диапазон «<коммит>^..<коммит>»,
      # а у корневого коммита родителя нет — git падает, и проверка красная при любом содержимом
      - name: gitleaks detect (вся история)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  compose:
    name: Compose — конфигурация, realm и скрипты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Генерация deploy/compose/.env (gen-dotenv.sh)
        run: ./deploy/scripts/gen-dotenv.sh
      - name: docker compose config
        run: docker compose -f deploy/compose/docker-compose.dev.yml --profile full config --quiet
      - name: realm-fsp.json — валидный JSON с ожидаемыми клиентами и ролями
        run: |
          python3 - <<'EOF'
          import json
          realm = json.load(open("deploy/keycloak/realm-fsp.json", encoding="utf-8"))
          assert realm["realm"] == "fsp"
          clients = {c["clientId"] for c in realm["clients"]}
          assert {"fsp-frontend", "fsp-backend-admin"} <= clients, clients
          roles = {r["name"] for r in realm["roles"]["realm"]}
          assert {"candidate", "employer", "admin"} <= roles, roles
          for flag in ("registrationAllowed", "verifyEmail", "loginWithEmailAllowed"):
              assert realm[flag] is True, flag
          print("realm ok:", sorted(clients), sorted(roles))
          EOF

  docker:
    name: Образ — ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: |
          if [ "${{ matrix.name }}" = frontend ] && [ ! -f frontend/package-lock.json ]; then
            echo "frontend ещё не создан — сборка образа пропущена"
            exit 0
          fi
          docker build -t fsp/${{ matrix.name }}:ci ${{ matrix.context }}
