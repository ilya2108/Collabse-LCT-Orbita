[project]
name = "fsp-backend"
version = "0.1.0"
description = "«Орбита ФСП» (ЛЦТ 2026, спец. трек ФСП) — backend, модульный монолит FastAPI"
# readme намеренно не указан: корневой README.md лежит вне backend/, setuptools запрещает ссылки наружу
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyJWT[crypto]>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "gigachat>=0.1.38",
    "yandex-cloud-ml-sdk>=0.5",
    "pypdf>=4.3",
    "orjson>=3.10",
    "python-multipart>=0.0.9",
    "aiogram>=3.13,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "httpx>=0.27",
]
# только для tools/validate (ярусы валидации, графики отчёта) — в образ backend не ставится
validate = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
# YAML графов/шаблонов и md-промпты лежат внутри пакета и нужны в образе
app = ["skills/**/*.yaml", "skills/**/*.yml", "modules/llm/prompts/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "db: интеграционные тесты с PostgreSQL (DATABASE_URL из tests/conftest.py); без БД — skip",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "T20"]
ignore = [
    "B008",  # FastAPI DI использует вызовы Depends()/Query() в дефолтах — это идиома фреймворка
]

[tool.ruff.lint.per-file-ignores]
# табличные демо-данные сида читаются лучше одной строкой на запись
"app/tools/seed.py" = ["E501"]
# CLI-инструменты печатают в stdout намеренно
"app/tools/*.py" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
