# Эталонный шаблон fe.B1 L1 (Компонентная архитектура React, применение по образцу).
# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: fe.B1.L1.lift_state
node: fe.B1
level: 1
kind: mcq_reasoned
title: "Общее состояние двух соседних компонентов"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Однонаправленный поток данных в React: состояние, нужное нескольким компонентам,
  поднимается к ближайшему общему предку и передаётся вниз через props и колбэки
  (один источник правды); изменения вне состояния (модульная переменная, ref) не вызывают
  перерисовку; дублирование состояния с синхронизацией эффектами — анти-паттерн.

invariant: >-
  Два компонента-соседа (сиблинга) должны отображать и изменять одни и те же данные;
  ровно одна опция — подъём состояния к общему родителю с передачей через props/колбэки;
  неверные опции: дублирование состояния в каждом компоненте с синхронизацией через
  useEffect, мутация данных вне состояния React (переменная модуля, ref.current),
  обход потока данных (глобальные события DOM, вызов методов соседа через ref).

vary: >-
  Домен (корзина и список товаров; фильтры и таблица; выбранная строка и панель деталей;
  форма и превью), имена компонентов, порядок опций, конкретная «неправильная» механика
  (модульная переменная, useRef, DOM-события, ref на соседа).

forbidden_changes: >-
  Не предлагать в опциях глобальные библиотеки состояния (Redux, zustand) и контекст —
  на L1 они дают второй защитимый ответ. Не называть в условии «подъём состояния»,
  «lifting state up», «единый источник правды». Не менять число опций и формат
  «ключ + обоснование».

trap: >-
  Синхронизация двух локальных состояний через useEffect выглядит «реактивной» и рабочей;
  ref или переменная модуля кажутся «проще, без лишних перерисовок» — но перерисовку
  как раз и не вызывают.

stack_tags: [react, typescript]

rubric:
  - id: lift_state
    w: 0.5
    text: >-
      Называет подъём состояния к ближайшему общему родителю и передачу вниз данных
      и колбэка через props.
  - id: single_source
    w: 0.3
    text: >-
      Объясняет, почему дублирование состояния с синхронизацией через useEffect — два
      источника правды: рассинхрон, лишние рендеры, хрупкость.
  - id: rerender_model
    w: 0.2
    text: >-
      Понимает, что мутация переменной модуля или ref.current не запускает перерисовку,
      поэтому сосед не обновится.

anchor_variant:
  statement: |
    В React-приложении магазина страница каталога устроена так: компонент `CatalogPage`
    рендерит два дочерних компонента-соседа — `ProductList` (у каждого товара кнопка
    «В корзину») и `CartSummary` (число товаров и сумма в шапке). Сейчас `CartSummary`
    всегда показывает 0: он ничего не знает о нажатиях в `ProductList`.

    Как по правилам React организовать состояние корзины, чтобы оба компонента видели одни
    и те же данные? Выберите один вариант и обоснуйте в 1–2 предложениях.
  options:
    - key: A
      text: >-
        Хранить состояние корзины в `CatalogPage` (общем родителе) и передавать его вместе
        с функцией добавления обоим дочерним компонентам через props.
    - key: B
      text: >-
        Завести `useState` корзины в каждом из двух компонентов и синхронизировать их через
        `useEffect`, который копирует значение из одного в другой при изменении.
    - key: C
      text: >-
        Объявить переменную `let cart = []` в модуле рядом с компонентами: `ProductList`
        добавляет в неё товары, а `CartSummary` читает её при рендере.
    - key: D
      text: >-
        Хранить корзину в `useRef` внутри `CatalogPage` и передать `ref` обоим компонентам:
        `ProductList` пишет в `ref.current`, `CartSummary` читает оттуда.
  answer_key: A
  reference_answer: |
    A. Состояние, нужное нескольким компонентам, поднимается к ближайшему общему предку:
    `CatalogPage` хранит `cart` в `useState` и передаёт вниз данные и колбэк `onAdd`;
    изменение состояния родителя перерисовывает обоих детей — один источник правды.
    B создаёт два источника и хрупкую синхронизацию эффектами (рассинхрон, лишние рендеры).
    C и D меняют данные вне состояния React: ни переменная модуля, ни `ref.current`
    не вызывают перерисовку — `CartSummary` обновится случайно или никогда.
  estimated_minutes: 2

difficulty_anchor: {p_junior: 0.6, p_middle: 0.9, p_senior: 0.95}
max_time_sec: 180
max_answer_chars: 400
