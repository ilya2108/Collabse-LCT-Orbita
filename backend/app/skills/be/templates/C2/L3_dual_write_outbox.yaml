# Черновик be.C2 L3 (Распределённые системы и интеграции, неочевидный случай и цена).
# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.C2.L3.dual_write_outbox
node: be.C2
level: 3
kind: short_design
title: "Оценка «простой» публикации событий: dual write и что вместо него"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Согласованность БД и брокера сообщений: запись в свою БД и публикация события —
  две разные системы, общей транзакции между ними нет (dual write); надёжная публикация
  строится через transactional outbox или CDC с доставкой at-least-once
  и идемпотентными потребителями; внедрение в живую систему планируется этапами,
  у решения есть цена — лаг доставки, таблица outbox, ретраи и дедупликация.

invariant: >-
  Команда выделяет события из монолита/сервиса с БД; есть чужое «очевидное» предложение
  публиковать событие прямо рядом с записью в БД (в одной «транзакции» или сразу после
  коммита); есть внешние ограничения (чужие потребители, которых нельзя менять быстро,
  сроки, работающий продакшен). Ответ обязан: указать скрытый дефект dual write (частичный
  отказ — запись без события или событие без записи, откат после публикации); предложить
  рабочую стратегию (outbox с publisher/CDC); учесть at-least-once — дубли и порядок,
  идемпотентность потребителей; дать поэтапный план внедрения и явную цену решения.

vary: >-
  Домены (заказы и уведомления, платежи и бонусы, заявки и аналитика), брокер
  (Kafka, RabbitMQ, облачная шина), кто потребители и насколько их можно менять,
  сроки и формулировка «очевидного» предложения (транзакция вокруг publish, publish
  после commit, таймер-ретрай в коде).

forbidden_changes: >-
  Не называть в условии «dual write», «outbox», «CDC» — распознать проблему и назвать
  паттерн должен кандидат. Не давать брокеру и БД общую распределённую транзакцию
  «из коробки» (иначе дефекта нет). Не убирать внешние ограничения (чужие потребители,
  сроки) — без них это L2. Не требовать конкретный брокер или инструмент CDC.

trap: >-
  «Обернём INSERT и publish одной транзакцией БД» — брокер в транзакции БД
  не участвует: publish после коммита теряет событие при падении между ними, publish
  до коммита публикует события об откатившихся данных. Вторая ловушка — «добавим
  ретраи publish в коде»: ретраи не переживают падение процесса и порождают дубли
  без дедупликации у потребителей.

stack_tags: [kafka, postgresql, python]

rubric:
  - id: dual_write_defect
    w: 0.35
    text: >-
      Показывает скрытый дефект предложения: БД и брокер не связаны одной транзакцией;
      разбирает конкретный сценарий расхождения (коммит есть — событие потеряно,
      или событие ушло — транзакция откатилась).
  - id: outbox_strategy
    w: 0.25
    text: >-
      Предлагает рабочую стратегию: событие пишется в таблицу outbox в той же транзакции
      с бизнес-данными, отдельный публикатор/CDC доставляет его в брокер; объясняет,
      почему это закрывает частичный отказ.
  - id: delivery_semantics
    w: 0.2
    text: >-
      Учитывает семантику доставки: at-least-once означает дубли и возможные перестановки —
      потребителям нужны идемпотентность/дедупликация по ключу события; exactly-once
      «из коробки» не обещает.
  - id: rollout_and_cost
    w: 0.2
    text: >-
      Даёт поэтапный план для живой системы (outbox рядом с текущим кодом, публикатор,
      перевод потребителей, мониторинг лага) и называет цену: таблица и её очистка,
      лаг доставки, эксплуатация публикатора, работа потребителей с дублями.

anchor_variant:
  statement: |
    Маркетплейс выделяет из монолита сервис уведомлений и аналитику: при смене статуса
    заказа нужно публиковать событие `order_status_changed` в Kafka. Коллега предлагает
    «самое простое»: в обработчике смены статуса, сразу после записи в PostgreSQL,
    вызывать продюсер — «обернём всё одной транзакцией, если publish упадёт — откатим».
    Ограничения: заказов 200 тыс. в день, потребители аналитики — другая команда
    с релизами раз в месяц, терять события нельзя, монолит в проде, большой рефакторинг
    сейчас не согласуют.

    Оцените предложение коллеги: в чём его скрытая проблема и в каком сценарии она
    выстрелит; что предложите вместо него; что потребуется от потребителей; какими
    этапами внедрите в работающую систему и какова цена вашего решения. До 1000 знаков.
  reference_answer: |
    Предложение — классическая двойная запись: Kafka не участвует в транзакции PostgreSQL.
    «Обернуть одной транзакцией» нельзя: publish до коммита — при откате аналитика
    получит событие о несуществующем статусе; publish после коммита — падение процесса
    или сети между коммитом и publish теряет событие, а терять нельзя. Ретраи в коде
    не спасают от падения процесса. Вместо этого — transactional outbox: в той же
    транзакции со статусом пишем событие в таблицу outbox; отдельный публикатор (или CDC
    по WAL, например Debezium) читает outbox и шлёт в Kafka, помечая отправленное.
    Доставка получается at-least-once: потребителям нужен event_id и дедупликация /
    идемпотентная обработка; порядок гарантируем ключом партиционирования по order_id.
    Этапы: 1) таблица outbox и запись событий рядом с текущей логикой; 2) публикатор
    с метрикой лага и алертом; 3) контракт события и дедупликация у аналитики под их
    релизный цикл; 4) выключение прямого publish. Цена: таблица outbox и её очистка,
    лаг секунды, эксплуатация публикатора, дубли у потребителей — приемлемо против
    потери событий.
  estimated_minutes: 7

