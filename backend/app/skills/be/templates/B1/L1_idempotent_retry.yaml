# Эталонный шаблон be.B1 L1 (Проектирование API, применение по образцу).
# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: be.B1.L1.idempotent_retry
node: be.B1
level: 1
kind: mcq_reasoned
title: "Безопасный автоповтор запроса при таймауте сети"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Идемпотентность и безопасность HTTP-методов: какой запрос можно повторить при обрыве сети
  без побочных эффектов; различие абсолютного обновления (PUT полного представления)
  и относительного изменения (PATCH/POST с дельтой или добавлением); создание ресурса POST.

invariant: >-
  Клиент не получил ответ (таймаут) и повторяет тот же запрос с тем же телом; серверных мер
  против дублей нет. Среди четырёх запросов ровно один идемпотентен по семантике операции;
  среди неверных обязательно есть POST создания ресурса, POST/PATCH добавления в коллекцию
  и PATCH/POST с относительным изменением величины (дельта).

vary: >-
  Предметная область (доставка, банк, бронирование, склад, подписки), имена ресурсов и значения
  в телах, порядок опций. Идемпотентной опцией может быть PUT полного представления
  или DELETE конкретного ресурса — но не оба сразу.

forbidden_changes: >-
  Не включать в опции одновременно PUT и DELETE (две верные). Не использовать слова
  «идемпотентный», «безопасный», «повторяемый» в тексте опций и не подсказывать ответ
  формулировкой условия. Не вводить серверный ключ идемпотентности — это материал уровня L2.
  Не менять число опций (4) и формат «ключ + обоснование».

trap: >-
  «PATCH всегда идемпотентен» — опция с относительным изменением (delta) выглядит безобидно,
  но при повторе применяется дважды. Вторая ловушка — POST «без видимого побочного эффекта»
  (добавление позиции в заказ), который кажется обновлением существующего ресурса.

stack_tags: [http, rest]

rubric:
  - id: idempotency_named
    w: 0.5
    text: >-
      Объясняет через идемпотентность: повторное выполнение оставляет сервер в том же
      состоянии, что и однократное; именно поэтому автоповтор безопасен.
  - id: relative_vs_absolute
    w: 0.3
    text: >-
      Различает абсолютное обновление (замена значения — повтор ничего не меняет)
      и относительное (дельта/добавление — повтор применяет изменение дважды).
  - id: side_effect_of_post
    w: 0.2
    text: >-
      Указывает, что повтор POST создания порождает второй ресурс (дубликат заказа/позиции).

anchor_variant:
  statement: |
    Мобильное приложение службы доставки отправляет запрос к API и не получает ответа
    за 10 секунд: соединение оборвалось уже после того, как сервер мог обработать запрос.
    Сетевая библиотека клиента настроена на один автоматический повтор того же запроса
    с тем же телом. Специальных мер против дублей (ключей идемпотентности, дедупликации)
    на сервере нет.

    Для какого из запросов такой автоповтор безопасен по семантике HTTP — то есть второе
    выполнение не изменит состояние сервера по сравнению с первым?

    Выберите один вариант и обоснуйте выбор в 1–2 предложениях.
  options:
    - key: A
      text: "`POST /orders` с телом заказа — оформить заказ из корзины."
    - key: B
      text: >-
        `PUT /orders/7f3a/address` с телом `{"street": "Ленина, 5", "flat": 12}` —
        заменить адрес доставки заказа.
    - key: C
      text: >-
        `PATCH /customers/me/bonus` с телом `{"delta": 150}` — начислить клиенту
        150 бонусных баллов.
    - key: D
      text: >-
        `POST /orders/7f3a/items` с телом `{"sku": "A-17", "qty": 1}` — добавить позицию
        в заказ.
  answer_key: B
  reference_answer: |
    B. PUT с полным представлением адреса идемпотентен: второй такой же запрос заменит адрес
    на тот же самый — состояние сервера не изменится, автоповтор безопасен.
    A и D — POST, создающие новые сущности: повтор даст второй заказ или вторую позицию
    в заказе. C — хотя метод PATCH, тело описывает относительное изменение (+150),
    и повтор начислит баллы дважды: идемпотентность определяется семантикой операции
    и тела, а не только методом.
  estimated_minutes: 2

difficulty_anchor: {p_junior: 0.55, p_middle: 0.85, p_senior: 0.95}
max_time_sec: 180
max_answer_chars: 400
