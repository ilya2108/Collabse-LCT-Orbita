# Эталонный шаблон be.B1 L3 (Проектирование API, неочевидный случай и цена решения).
# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.B1.L3.contract_evolution
node: be.B1
level: 3
kind: short_design
title: "Эволюция контракта публичного API без поломки интеграторов"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Совместимость контракта публичного API: почему новое значение перечисления и смена смысла
  числового поля не являются аддитивными изменениями; стратегия expand/contract
  (новое поле рядом со старым, двойная выдача, затем сокращение); где нужна новая версия,
  а где достаточно эволюции; Deprecation/Sunset, метрики использования версий,
  контрактные тесты; цена двойной поддержки против цены поломки у внешних команд.

invariant: >-
  Публичный API с внешними клиентами, которых нельзя обновить одновременно (часть обновляется
  редко). Требуются два изменения: расширение набора значений поля-перечисления
  и изменение смысла существующего числового поля. В условии присутствует чужое утверждение
  «изменения аддитивны, ломать нечего», которое кандидат должен оценить. Ответ должен
  содержать анализ поломки, план перехода, решение о версионировании и цену.

vary: >-
  Домен (платежи, доставка, подписки, билеты, HR), конкретные поля (статус, сумма, дата
  и часовой пояс, тип идентификатора, единицы измерения), число интеграторов и их ритм
  обновления, способ версионирования в компании (путь, заголовок, поле).

forbidden_changes: >-
  Не сводить задачу к одному изменению — нужны оба (перечисление + смысл поля). Не подсказывать
  в условии «expand/contract», «Sunset», «семантическая несовместимость», «v2». Сохранять
  утверждение коллеги об аддитивности как объект оценки, а не как подсказку. Не задавать
  в условии готовую стратегию версионирования.

trap: >-
  Считать новое значение перечисления и новое поле «аддитивными» и безопасными (клиент
  со строгой обработкой статусов упадёт, число в старом поле изменит смысл). Противоположная
  ловушка — «сразу v2 для всех и уведомить» без переходного периода: дешёво в коде, но
  переносит стоимость на десятки внешних команд. Третья — версионировать всё подряд там,
  где хватало нового поля.

stack_tags: [http, rest, openapi]

rubric:
  - id: breakage_analysis
    w: 0.3
    text: >-
      Показывает, что именно сломается: новое значение перечисления ломает клиентов
      со строгой обработкой статусов (switch без default, валидация по списку, учёт
      в бухгалтерии); смена смысла числового поля — семантическая несовместимость,
      старый клиент прочитает число неверно даже при валидной схеме.
  - id: expand_contract
    w: 0.3
    text: >-
      Предлагает эволюцию: новое поле рядом со старым (сумма с валютой), двойная выдача
      на переходный период, затем сокращение; старые клиенты не получают неизвестных
      значений (маппинг новых статусов в старые + отдельное поле/ресурс с деталями
      или отдельная версия).
  - id: versioning_decision
    w: 0.2
    text: >-
      Осознанно решает, где нужна новая версия (несовместимое перечисление), а где
      достаточно аддитивного поля; называет способ версионирования и его последствия
      (двойная поддержка, маршрутизация, документация).
  - id: rollout_cost
    w: 0.2
    text: >-
      Описывает выкатку и цену: заголовки Deprecation/Sunset, уведомление интеграторов,
      метрика доли трафика по версиям и клиентам как критерий отключения, контрактные
      тесты на обе версии; сравнивает стоимость двойной поддержки со стоимостью поломки
      у внешних команд.

anchor_variant:
  statement: |
    Публичный API платёжного сервиса используют около 40 внешних интеграторов (магазины,
    CRM-системы); часть из них обновляет код раз в год. В ответе `GET /payments/{id}` поле
    `status` — строка из набора `pending | succeeded | failed`, поле `amount` — целое число
    в копейках. Продукт требует: (1) добавить статусы `refunded` и `partially_refunded`;
    (2) поддержать суммы с валютой — появляются платежи в тенге и юанях.

    Коллега предлагает: «Это аддитивные изменения, ломать нечего: добавим значения статуса
    и поле `currency` рядом с `amount`».

    Оцените предложение: что и у каких клиентов сломается. Предложите план изменения
    контракта с минимальным риском для интеграторов: где нужна новая версия, где достаточно
    эволюции в рамках текущей, как выкатывать и когда отключать старое. Укажите цену
    каждого шага (сроки, поддержка, наблюдаемость). До 800 знаков.
  reference_answer: |
    Новые значения перечисления не аддитивны для потребителей: клиент с жёсткой обработкой
    статусов (switch без default, валидация по списку) упадёт или учтёт возврат как
    «неизвестно»/«успех» — у части интеграторов это бухгалтерия. `amount` в копейках без
    валюты для старых клиентов означает рубли: добавить `currency` схема позволяет, но число
    10000 в тиынах будет прочитано как рубли — семантическая несовместимость хуже
    синтаксической. План (expand/contract): 1) ввести поле `money: {amount, currency}`
    рядом с `amount`; для рублёвых платежей заполнять оба, для нерублёвых старое поле
    отдавать null и документировать; 2) статусы возвратов — только в новой версии (`v2`
    в пути или заголовке): `v1` продолжает отдавать `succeeded` плюс отдельный ресурс
    `/payments/{id}/refunds`, чтобы старые клиенты не встречали неизвестных значений;
    3) заголовки Deprecation/Sunset, рассылка интеграторам, метрика доли трафика v1
    по клиентам — отключать, когда доля ниже порога, а крупные интеграторы переехали;
    4) контрактные тесты на обе версии. Цена: двойная поддержка 6–12 месяцев и маппинг-слой,
    зато без аварий у 40 команд; «сразу v2 для всех» дешевле в коде, но переносит стоимость
    на интеграторов.
  estimated_minutes: 6

difficulty_anchor: {p_junior: 0.1, p_middle: 0.4, p_senior: 0.8}
