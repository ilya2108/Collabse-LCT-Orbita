# Эталонный шаблон be.B1 L2 (Проектирование API, проектирование с компромиссом).
# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.B1.L2.idempotency_key
node: be.B1
level: 2
kind: short_design
title: "Защита POST от дублей при повторах клиента"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Идемпотентность создающих запросов на стороне сервера: ключ идемпотентности от клиента,
  хранение результата под ключом и его воспроизведение при повторе, конфликт «тот же ключ —
  другое тело», защита от одновременных повторов (уникальное ограничение / блокировка),
  срок жизни ключей и совместимость со старыми клиентами.

invariant: >-
  POST создаёт ресурс с бизнес-последствиями (бронирование, платёж, заказ); клиенты
  повторяют запрос при таймауте, в данных уже есть дубли; возможны одновременные повторы;
  часть клиентов нельзя обновить сразу. Ответ должен описать: идентификацию «того же
  запроса», что и как долго хранит сервер, ответ на повтор, поведение при другом теле
  под тем же ключом, защиту от гонки.

vary: >-
  Предметная область (бронирования, платежи, заказы, заявки на выпуск карт), масштаб
  (число дублей, инстансов сервера), типы клиентов (мобильные, партнёрский API, веб),
  СУБД и фреймворк, срок жизни ключей.

forbidden_changes: >-
  Не убирать из условия одновременные повторы и невозможность обновить всех клиентов —
  без них задача вырождается в L1. Не подсказывать в условии заголовок Idempotency-Key,
  уникальный индекс или хранение ответа. Не превращать задание в выбор из вариантов
  и не ограничивать решение конкретной СУБД.

trap: >-
  Дедупликация по хэшу тела или по признаку «недавно был такой же запрос» — ложные
  срабатывания при двух честных одинаковых действиях и отсутствие ответа на гонку.
  «Решить на клиенте» (заблокировать кнопку, ретраи отключить) — не защищает от сетевого
  повтора и не затрагивает старые версии клиентов.

stack_tags: [http, rest, postgresql]

rubric:
  - id: client_key
    w: 0.3
    text: >-
      Клиент генерирует уникальный ключ попытки (UUID) и передаёт его в заголовке/поле;
      сервер считает ключ в области пользователя или клиента, чтобы чужие ключи
      не пересекались.
  - id: stored_response
    w: 0.25
    text: >-
      Сервер сохраняет результат первого выполнения (статус, id/тело ответа) под ключом
      и на повтор отдаёт тот же ответ, не создавая второй ресурс; запись о ключе создаётся
      атомарно с ресурсом.
  - id: conflicts
    w: 0.25
    text: >-
      Обрабатывает «тот же ключ — другое тело» (ошибка клиенту, не тихая подмена) и гонку
      одновременных запросов: уникальное ограничение/блокировка, второй запрос ждёт
      или получает конфликт, а не создаёт дубль.
  - id: tradeoffs
    w: 0.2
    text: >-
      Называет цену и ограничения: срок жизни ключей и очистка, хранение ответов,
      совместимость со старыми клиентами без ключа (доменное уникальное ограничение
      как запасной барьер).

anchor_variant:
  statement: |
    Сервис бронирования столиков принимает `POST /bookings` от веб-клиента и мобильного
    приложения. При таймауте клиенты повторяют запрос, и за неделю в базе накопилось
    340 дублей: гость видит два одинаковых слота, ресторан — двух гостей на одном столике.
    Бэкенд — FastAPI с PostgreSQL, два инстанса за балансировщиком. Клиенты обновить
    можно, но часть пользователей не обновит приложение ещё несколько месяцев.

    Спроектируйте механизм, при котором повтор того же запроса создания не порождает второе
    бронирование. Опишите: как клиент и сервер понимают, что это «тот же запрос»; что хранит
    сервер и как долго; что вернуть на повтор; что делать, если под тем же ключом пришло
    другое тело; как защититься от двух одновременных одинаковых запросов; что будет
    со старыми клиентами. До 800 знаков.
  reference_answer: |
    Клиент генерирует UUID на каждую попытку создания и передаёт его в заголовке
    `Idempotency-Key`; на сервере ключ рассматривается в паре с пользователем (scope).
    Таблица `idempotency_key(key, user_id, request_hash, response_status, response_body,
    created_at)` с UNIQUE (user_id, key); запись вставляется в одной транзакции
    с бронированием. Повтор с тем же ключом и тем же хэшем тела → вернуть сохранённый
    ответ (тот же 201 и тот же id). Тот же ключ, другое тело → 422 `idempotency_key_reused`.
    Два одновременных запроса: первый вставляет запись (UNIQUE), второй ловит конфликт
    и либо ждёт завершения и отдаёт сохранённый ответ, либо отвечает 409
    `request_in_progress`. TTL ключей 24–48 ч, очистка джобой. Для старых клиентов
    без заголовка — доменный барьер: уникальный индекс (table_id, slot_at, user_id)
    и понятный 409 «уже забронировано». Цена: лишняя запись на каждый POST и хранение
    ответов; зато поведение старых клиентов не ломается.
  estimated_minutes: 5

difficulty_anchor: {p_junior: 0.3, p_middle: 0.7, p_senior: 0.9}
max_time_sec: 300
