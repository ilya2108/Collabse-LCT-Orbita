# Черновик be.B2 L1 (Поддерживаемый код и тесты, применение по образцу).
# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: be.B2.L1.unit_tests_first
node: be.B2
level: 1
kind: mcq_reasoned
title: "Каким видом тестов покрыть чистую доменную функцию"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Пирамида тестов: быстрые детерминированные модульные тесты — основание; изолированная
  доменная логика без ввода-вывода покрывается именно ими, а e2e и интеграционные тесты
  оставляются для связки компонентов. Умение узнать, какой слой пирамиды соответствует
  конкретному коду.

invariant: >-
  Есть чистая функция бизнес-логики с ветвлениями и граничными случаями, без обращения
  к БД, сети и файлам; команда решает, как её покрыть. Ровно одна верная опция — быстрые
  модульные тесты самой функции; среди неверных обязательно есть e2e-через-интерфейс
  и интеграционный тест с реальной БД, которые «надёжнее на вид».

vary: >-
  Предметная область функции (скидка, стоимость доставки, комиссия, срок хранения),
  язык формулировок, набор граничных случаев, порядок опций, названия инструментов.

forbidden_changes: >-
  Не называть в условии слова «модульный», «юнит», «пирамида» — они подсказывают ответ.
  Не делать функцию зависимой от БД или сети (тогда верных опций станет две). Не менять
  число опций (4) и формат «ключ + обоснование». Не добавлять материал L2
  (стратегию рефакторинга, выправление пирамиды).

trap: >-
  Интеграционный тест с реальной БД или e2e через HTTP выглядит «ближе к продакшену,
  значит надёжнее»; на деле он медленнее, нестабильнее и не локализует ошибку в чистой
  функции. Вторая ловушка — ручная проверка на стейдже как «самый быстрый способ».

stack_tags: [python, pytest]

rubric:
  - id: pyramid_fit
    w: 0.5
    text: >-
      Объясняет выбор слоем пирамиды: чистая логика без ввода-вывода покрывается быстрыми
      модульными тестами; e2e и интеграционные — для связки компонентов, а не для ветвлений
      одной функции.
  - id: speed_determinism
    w: 0.3
    text: >-
      Называет свойства модульных тестов: выполняются за миллисекунды, детерминированы,
      точно указывают место поломки, дёшево покрывают все граничные случаи.
  - id: distractor_cost
    w: 0.2
    text: >-
      Указывает цену неверных опций: e2e/интеграционные медленные и «мигают», ручная
      проверка не защищает от регрессий.

anchor_variant:
  statement: |
    В сервисе интернет-магазина появилась функция расчёта стоимости доставки:
    она принимает вес заказа, регион и признак «экспресс» и возвращает цену по тарифной
    сетке с пятью ветвлениями и граничными случаями (0 кг, ровно 10 кг, неизвестный
    регион — ошибка). Функция не обращается к БД, сети или файлам. Команда хочет
    защитить её от регрессий при будущих правках тарифов.

    С чего правильнее начать покрытие этой функции тестами?

    Выберите один вариант и обоснуйте выбор в 1–2 предложениях.
  options:
    - key: A
      text: >-
        Написать e2e-тест: браузером оформить заказ и проверить итоговую цену
        на странице подтверждения.
    - key: B
      text: >-
        Написать набор быстрых тестов самой функции: по тесту на каждую ветку тарифа
        и граничный случай (0 кг, 10 кг, неизвестный регион).
    - key: C
      text: >-
        Поднять тестовую БД и написать интеграционный тест: сохранить заказ и проверить
        цену в записи — ближе всего к продакшену.
    - key: D
      text: >-
        Проверить расчёт вручную на стейдже по чек-листу перед каждым релизом —
        быстрее, чем писать тесты.
  answer_key: B
  reference_answer: |
    B. Функция — чистая доменная логика без ввода-вывода, поэтому её ветвления
    и граничные случаи дёшево и надёжно покрываются быстрыми модульными тестами:
    они выполняются за миллисекунды, детерминированы и точно показывают, какая ветка
    сломалась. A и C проверяют то же самое через тяжёлые слои (браузер, БД) — медленно,
    нестабильно и без локализации ошибки; им место выше по пирамиде и в меньшем числе.
    D не защищает от регрессий вовсе: ручной чек-лист не выполняется при каждой правке.
  estimated_minutes: 2

difficulty_anchor: {p_junior: 0.6, p_middle: 0.85, p_senior: 0.95}
max_time_sec: 180
max_answer_chars: 400
