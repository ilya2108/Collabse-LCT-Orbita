# Черновик be.B2 L2 (Поддерживаемый код и тесты, проектирование с компромиссом).
# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.B2.L2.legacy_refactoring
node: be.B2
level: 2
kind: short_design
title: "Безопасное изменение легаси-модуля без тестов"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Работа с легаси: прежде чем менять код без тестов, его поведение фиксируется
  характеризующими тестами «как есть»; изменение вносится маленькими шагами через
  выделение шва (вынос чистой логики, параметризация зависимостей), с постоянным прогоном
  тестов; полная переписка «с нуля» — риск, у осторожного пути есть цена во времени.

invariant: >-
  Есть работающий в продакшене модуль без тестов (сотни строк, перемешаны расчёт
  и ввод-вывод), в него нужно добавить новое бизнес-правило в срок; историю правок никто
  из команды не помнит. Ответ должен описать: как зафиксировать текущее поведение,
  как выделить место изменения, порядок шагов и цену/риски выбранного пути (включая то,
  что характеризующие тесты фиксируют и возможные старые ошибки).

vary: >-
  Предметная область (тарифы, начисление бонусов, расчёт комиссий, маршрутизация заявок),
  размер модуля и срок, язык и фреймворк, источник требования (закон, продукт),
  формулировка нового правила.

forbidden_changes: >-
  Не убирать из условия отсутствие тестов и срок — без них задача вырождается
  в «просто напишите код». Не подсказывать в условии термины «характеризующий тест»,
  «шов», «стратегия душителя». Не превращать в выбор из готовых вариантов. Не добавлять
  распределённость или миграции БД — это другие узлы.

trap: >-
  «Перепишем модуль с нуля — он всё равно ужасен»: переписывание без фиксации поведения
  теряет накопленные в коде неочевидные правила и не успевает в срок. Вторая ловушка —
  «сначала покроем всё модульными тестами на 100 %»: без выделения швов это недостижимо
  в срок, достаточно зафиксировать поведение вокруг места изменения.

stack_tags: [python, pytest, refactoring]

rubric:
  - id: characterization
    w: 0.35
    text: >-
      Предлагает зафиксировать текущее поведение до правок: характеризующие тесты
      на реальных входах/golden-данных вокруг места изменения; признаёт, что они
      фиксируют «как есть», включая возможные старые ошибки.
  - id: seam_extraction
    w: 0.3
    text: >-
      Описывает выделение места изменения: вынести чистый расчёт из перемешанного
      с вводом-выводом кода (шов, параметризация зависимостей), чтобы новое правило
      легло в тестируемую функцию.
  - id: small_steps
    w: 0.2
    text: >-
      Планирует маленькие обратимые шаги с прогоном тестов после каждого; новое правило
      добавляется только после зелёной фиксации поведения.
  - id: tradeoffs
    w: 0.15
    text: >-
      Называет цену и отвергает крайности: полная переписка или 100 % покрытие до правок
      не укладываются в срок; осторожный путь стоит времени на тесты, но защищает продакшен.

anchor_variant:
  statement: |
    В биллинге интернет-провайдера есть модуль расчёта абонентской платы: один файл
    на 800 строк, расчёт перемешан с чтением из БД и записью в лог, тестов нет, автор
    уволился. С нового месяца по требованию юристов нужно добавить правило: при паузе
    договора больше 15 дней плата за месяц пересчитывается пропорционально. Срок — две
    недели; модуль каждый день считает деньги реальным клиентам, ошибиться нельзя.

    Опишите, как внесёте изменение: как зафиксируете текущее поведение до правок;
    как подготовите в коде место для нового правила; в каком порядке будете действовать;
    какова цена вашего подхода и почему не подходит «переписать модуль с нуля».
    До 800 знаков.
  reference_answer: |
    Сначала фиксирую поведение «как есть»: выгружаю реальные анонимизированные кейсы
    (обычный месяц, пауза короче/длиннее 15 дней, граница месяца) и пишу характеризующие
    тесты: вход → текущая сумма; они фиксируют и старые странности — это осознанно,
    отличать «баг» от «правила» будем с юристами отдельно. Затем выделяю шов: выношу
    чистую функцию расчёта (вход — данные договора и период, выход — сумма) из кода
    с БД и логами, старый модуль делегирует ей; тесты остаются зелёными. Новое правило
    добавляю в чистую функцию отдельными модульными тестами на пропорцию и границу
    15 дней. Шаги маленькие, после каждого — полный прогон; выкладка с фиче-флагом
    и сверкой расчёта на копии данных за прошлый месяц. Цена — несколько дней на тесты
    и вынос функции. Переписка с нуля потеряла бы неочевидные правила в коде
    и не уложилась бы в срок.
  estimated_minutes: 5

