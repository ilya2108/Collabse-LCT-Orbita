# Эталонный шаблон be.D4 L2 (Устройство СУБД, проектирование с компромиссом).
# Развитие примера из PLAN.md §4.1. Формат — docs/templates-spec.md.
# Вид: short_design (судья по рубрике, 100 %).
id: be.D4.L2.composite_index
node: be.D4
level: 2
kind: short_design
title: "Составной индекс под равенство и сортировку"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Составной B-tree индекс под запрос «равенство по нескольким колонкам + ORDER BY + LIMIT»:
  порядок колонок (сначала равенство, затем колонка сортировки/диапазона), почему индекс
  с неверным порядком почти не помогает, проверка планом (EXPLAIN ANALYZE, узел Sort,
  Buffers) и цена индекса (запись, место, построение); частичный и покрывающий индексы
  как опции.

invariant: >-
  Таблица не меньше 1 млн строк; запрос с условиями равенства по двум колонкам, ORDER BY
  по третьей и небольшим LIMIT; уже есть составной индекс с неверным порядком колонок
  (колонка сортировки/диапазона первой); одна из колонок равенства низкоселективна.
  Ответ должен объяснить, почему существующий индекс не помогает, предложить индекс,
  способ проверки и цену.

vary: >-
  Предметная область (заказы, события, платежи, телеметрия, сообщения), имена колонок,
  объёмы (1–50 млн строк), распределение значений статуса, направление сортировки,
  размер LIMIT, наличие дополнительных колонок в SELECT (для покрывающего индекса).

forbidden_changes: >-
  Не менять число условий (два равенства + одна сортировка). Не подсказывать порядок колонок
  и не упоминать в условии «равенство → сортировка», «селективность», «покрывающий» —
  это и есть проверяемое знание. Не заменять ORDER BY + LIMIT на агрегат. Существующий
  «неудачный» индекс должен выглядеть правдоподобно (обе нужные колонки в нём есть).

trap: >-
  Отдельный индекс на каждую колонку (bitmap AND, потом сортировка в памяти) или
  составной индекс, где первой стоит колонка сортировки/диапазона; «добавить индекс
  по статусу» при низкой селективности; «увеличить work_mem» вместо исправления доступа.

stack_tags: [postgresql, sql]

rubric:
  - id: composite_order
    w: 0.4
    text: >-
      Предлагает составной индекс в порядке «колонки равенства → колонка сортировки»
      и объясняет, почему существующий индекс с колонкой сортировки первой заставляет
      проходить весь диапазон с фильтром.
  - id: plan_check
    w: 0.3
    text: >-
      Проверяет результат планом: EXPLAIN (ANALYZE, BUFFERS) до и после — ожидаемый
      Index Scan по новому индексу без узла Sort, меньше прочитанных блоков; или
      аргументирует через селективность и порядок ключей B-tree.
  - id: tradeoff
    w: 0.3
    text: >-
      Называет цену: место и замедление записи, построение CONCURRENTLY на живой таблице;
      рассматривает частичный индекс (WHERE по статусу) или покрывающий (INCLUDE)
      как опции с их ограничениями.

anchor_variant:
  statement: |
    Таблица `orders` в PostgreSQL — 5,2 млн строк; колонки `id`, `customer_id`, `status`
    (6 значений, 70 % строк — `delivered`), `created_at`, `total`. Личный кабинет показывает
    последние оплаченные заказы клиента:

    ```sql
    SELECT id, created_at, total
    FROM orders
    WHERE customer_id = $1 AND status = 'paid'
    ORDER BY created_at DESC
    LIMIT 20;
    ```

    Запрос выполняется 400–900 мс. В таблице есть индексы `orders_pkey (id)`
    и `orders_created_customer_idx (created_at, customer_id)`. Разработчик удивлён:
    «индекс по обеим колонкам есть, а планировщик идёт по всему индексу с фильтром».

    Объясните, почему существующий индекс не помогает; предложите индекс, при котором запрос
    станет быстрым; опишите, как проверите результат, и какова цена решения. До 800 знаков.
  reference_answer: |
    В индексе `(created_at, customer_id)` первой стоит колонка сортировки, а не равенства:
    чтобы найти строки одного клиента, планировщик проходит индекс по всему диапазону
    `created_at` и фильтрует по `customer_id` — выигрыша почти нет. Нужен составной индекс,
    где сначала колонки условий равенства, затем колонка сортировки:
    `CREATE INDEX CONCURRENTLY orders_customer_status_created_idx
    ON orders (customer_id, status, created_at DESC)`. B-tree даёт узкий диапазон одного
    клиента с нужным статусом, уже упорядоченный по `created_at`, и `LIMIT 20` читает
    20 записей индекса без сортировки. Проверка: `EXPLAIN (ANALYZE, BUFFERS)` до и после —
    ожидаем Index Scan по новому индексу без узла Sort и на порядок меньше Buffers; затем
    p95 по pg_stat_statements. Цена: ещё один индекс на 5 млн строк (≈150–250 МБ),
    замедление INSERT/UPDATE по этим колонкам, время построения (CONCURRENTLY, чтобы
    не блокировать запись). Опции: частичный индекс `WHERE status = 'paid'`, если нужны
    только оплаченные (меньше и быстрее), или `INCLUDE (total)` для Index Only Scan.
    Отдельные индексы на каждую колонку не заменяют составной: bitmap AND не даёт порядка,
    сортировка остаётся.
  estimated_minutes: 4

difficulty_anchor: {p_junior: 0.3, p_middle: 0.75, p_senior: 0.9}
max_time_sec: 300
max_answer_chars: 800
