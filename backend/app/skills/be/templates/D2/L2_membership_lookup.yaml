id: be.D2.L2.membership_lookup
node: be.D2
level: 2
kind: mcq_reasoned
title: "Структура данных для проверки принадлежности в горячем пути"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Выбор структуры данных под операцию: проверка принадлежности к большому
  редко меняющемуся набору в горячем пути — это хэш-множество с O(1) на поиск;
  умение сравнить с альтернативами (линейный поиск O(n), бинарный поиск по
  отсортированному массиву O(log n), запрос в БД на каждую проверку) и назвать
  цену выбора (память, требование хэшируемости, перестройка при обновлении).

invariant: >-
  Сервис на каждый запрос проверяет вхождение значения в набор из сотен тысяч —
  миллионов элементов; набор обновляется редко (раз в часы), проверка — тысячи раз
  в секунду; сейчас реализация заметно медленная (линейный поиск или запрос в БД
  на каждую проверку). Ровно одна верная опция — хэш-множество в памяти процесса;
  среди неверных обязательно есть бинарный поиск по отсортированному списку
  («почти так же быстро, экономнее») и поход в БД на каждую проверку.

vary: >-
  Предметная область набора (заблокированные токены, стоп-слова, чёрный список карт,
  забаненные устройства), размер набора и частота обновления, язык, источник набора
  (файл, таблица), порядок опций.

forbidden_changes: >-
  Не называть в условии «хэш», «set», «O(1)» — подсказка ответа. Не делать набор часто
  обновляемым (десятки раз в секунду) — тогда у кэша в памяти появится вторая верная
  альтернатива. Не менять число опций (4) и формат «ключ + обоснование». Не уводить
  в распределённый кэш — это материал других узлов.

trap: >-
  Бинарный поиск по отсортированному массиву: выглядит почти так же быстро и «экономнее
  по памяти», но это O(log n) с десятками сравнений на миллионе элементов против O(1),
  и вставка новых элементов требует сдвига массива. Вторая ловушка — «пусть ищет БД,
  у неё индекс»: сетевой запрос на каждую проверку в горячем пути — миллисекунды
  вместо наносекунд.

stack_tags: [python, algorithms]

rubric:
  - id: hash_o1
    w: 0.4
    text: >-
      Объясняет выбор операцией: нужна только проверка принадлежности, хэш-множество
      даёт её в среднем за O(1) независимо от размера набора.
  - id: alternatives_cost
    w: 0.35
    text: >-
      Сравнивает с дистракторами по сложности: линейный поиск O(n), бинарный O(log n)
      плюс поддержание сортировки, запрос в БД — сетевая задержка в каждом запросе.
  - id: memory_tradeoff
    w: 0.25
    text: >-
      Называет цену решения: память процесса под набор, перестройка/обновление снимка
      при изменении набора, требование хэшируемости элементов.

anchor_variant:
  statement: |
    API-шлюз на каждый входящий запрос проверяет, не отозван ли токен устройства:
    список отозванных токенов — 1,2 млн строк, выгружается из БД и обновляется раз
    в час. Сейчас токены лежат в списке Python, и проверка `token in revoked_list`
    при 3 000 запросах в секунду съедает почти всё CPU-время процесса.

    Как хранить отозванные токены в памяти процесса, чтобы проверка перестала быть
    узким местом?

    Выберите один вариант и обоснуйте выбор в 1–2 предложениях, включая цену решения.
  options:
    - key: A
      text: >-
        Отсортировать список один раз при загрузке и искать бинарным поиском —
        скорость почти та же, а лишней памяти не нужно.
    - key: B
      text: >-
        Хранить токены в хэш-множестве, пересобирая его при часовом обновлении выгрузки.
    - key: C
      text: >-
        Убрать список из памяти и на каждый запрос проверять токен запросом к БД —
        по индексу это быстро.
    - key: D
      text: >-
        Разбить список на 26 списков по первому символу токена — каждый поиск станет
        в 26 раз быстрее.
  answer_key: B
  reference_answer: |
    B. Операция одна — проверка принадлежности, и хэш-множество выполняет её в среднем
    за O(1): при 3 000 RPS это наносекунды вместо прохода по 1,2 млн элементов. Цена —
    память процесса под набор и пересборка снимка раз в час при обновлении выгрузки,
    что при редких обновлениях приемлемо. A даёт O(log n): ~20 сравнений на проверку,
    заметно медленнее O(1), и сортировку нужно поддерживать. C меняет CPU на сетевую
    задержку в каждом запросе горячего пути. D оставляет линейный поиск, лишь деля
    константу: сложность по-прежнему O(n).
  estimated_minutes: 3

