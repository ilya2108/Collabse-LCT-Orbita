# Черновик be.C1 L2 (Поставка: CI/CD и контейнеры, анализ с компромиссом).
# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: be.C1.L2.secret_in_image
node: be.C1
level: 2
kind: mcq_reasoned
title: "Секрет попал в Docker-образ: что делать"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Слоистая модель Docker-образа: файл, попавший в слой, остаётся в истории образа даже
  после удаления следующим слоем; секрет из опубликованного образа считается
  скомпрометированным — нужна ротация и передача секретов в рантайме (переменные
  окружения, секрет-хранилище), а не в сборке.

invariant: >-
  Секрет (ключ внешнего API или учётные данные) попал в образ на этапе сборки
  (COPY конфига или ENV в Dockerfile); образ опубликован в registry, доступном
  не только команде. Ровно одна верная опция — ротация секрета плюс передача в рантайме
  и пересборка; среди неверных обязательно есть «удалить файл следующим слоем RUN rm»
  и «ограничить доступ к registry — этого достаточно».

vary: >-
  Вид секрета (ключ платёжного шлюза, токен интеграции, пароль БД), способ попадания
  (COPY .env, ENV, аргумент сборки, вшитый конфиг), тип registry (общий корпоративный,
  облачный), предметная область сервиса, порядок опций.

forbidden_changes: >-
  Не называть в условии слои и историю образа — догадка про механизм и есть проверка.
  Не делать registry публичным для всего интернета (тогда ротация очевидна и без знания
  слоёв). Не добавлять вторую верную опцию (например, одновременно годные ротацию
  и multi-stage пересборку в разных опциях). Не менять число опций (4).

trap: >-
  «Удалить файл следующей инструкцией RUN rm и перевыложить» — файл исчезает из итоговой
  файловой системы, но остаётся в родительском слое и достаётся из истории образа.
  Вторая ловушка — «сделать registry приватным»: сузит круг, но секрет уже скачивали,
  и он продолжает жить в каждом вытянутом образе.

stack_tags: [docker, ci, security]

rubric:
  - id: layers_immutable
    w: 0.4
    text: >-
      Объясняет механизм: слои образа неизменяемы, удаление файла следующим слоем
      не убирает его из истории — секрет извлекается из опубликованного образа.
  - id: rotate_first
    w: 0.35
    text: >-
      Говорит, что попавший в образ секрет считается скомпрометированным: первым делом
      ротация/отзыв, затем пересборка без секрета.
  - id: runtime_secrets
    w: 0.25
    text: >-
      Называет правильное место секретов — рантайм (переменные окружения при запуске,
      секрет-хранилище оркестратора), а не Dockerfile и слои сборки.

anchor_variant:
  statement: |
    Команда сервиса рассылок собирает Docker-образ в CI. В Dockerfile есть строка
    `COPY .env /app/.env`, и в файле лежит действующий ключ платного SMS-шлюза.
    Образ уже три недели публикуется в корпоративный registry, доступный всем сотрудникам
    и подрядчикам компании. Сегодня это заметил новый разработчик.

    Какой порядок действий правильный?

    Выберите один вариант и обоснуйте выбор в 1–2 предложениях.
  options:
    - key: A
      text: >-
        Добавить в Dockerfile следующей строкой `RUN rm /app/.env` и перевыложить образ —
        файла в контейнере больше не будет.
    - key: B
      text: >-
        Попросить администраторов ограничить доступ к registry командой сервиса —
        ключ видели только свои, менять его не нужно.
    - key: C
      text: >-
        Отозвать и перевыпустить ключ у шлюза, убрать .env из образа и передавать ключ
        при запуске контейнера (окружение/секрет-хранилище), пересобрать и перевыложить
        образ.
    - key: D
      text: >-
        Зашифровать .env внутри образа, а ключ расшифровки положить рядом
        в entrypoint-скрипт — без него файл бесполезен.
  answer_key: C
  reference_answer: |
    C. Ключ три недели лежал в слоях образа, доступного широкому кругу — он считается
    скомпрометированным, поэтому первым делом отзыв и перевыпуск у шлюза. Дальше секрет
    убирается из сборки совсем и передаётся в рантайме (переменные окружения, секрет
    оркестратора), образ пересобирается. A не работает: слои неизменяемы, `RUN rm`
    прячет файл в итоговой ФС, но он достаётся из родительского слоя и истории образа.
    B не отменяет утечку: образ уже скачивали, копии живут локально. D — секрет
    и «замок» лежат вместе, это то же самое, что открытый ключ.
  estimated_minutes: 3

