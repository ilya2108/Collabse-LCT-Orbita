# Черновик be.B4 L2 (Отладка и диагностика, анализ по симптому).
# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.B4.L2.nightly_degradation
node: be.B4
level: 2
kind: short_design
title: "Диагностика ночной деградации, которая не воспроизводится на стейдже"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Диагностика по симптому: периодическая деградация локализуется корреляцией по времени —
  логи с идентификаторами запросов, метрики ресурсов (пул соединений, CPU, диск БД)
  и расписание фоновых процессов сопоставляются на одном интервале; гипотезы проверяются
  данными, а не правкой наугад, фикс подтверждается наблюдением за следующим окном.

invariant: >-
  Продакшен-сервис деградирует в одно и то же время суток на минуты и сам
  восстанавливается; на стейдже не воспроизводится; есть логи, базовые метрики и доступ
  к БД. Ответ должен содержать: сбор картины (корреляция логов/метрик/расписаний в окне
  сбоя), не меньше двух правдоподобных гипотез с конкурирующим фоновым процессом среди
  них, способ подтвердить каждую данными и критерий «исправлено» по следующим окнам.

vary: >-
  Время и длительность окна, симптом (5xx, таймауты, рост p99), предметная область
  сервиса, вид фонового конкурента (бэкап, пересчёт витрины, крон-джоба, VACUUM,
  ротация логов), СУБД и стек наблюдаемости.

forbidden_changes: >-
  Не называть причину в условии (ни слова про бэкап/крон как виновника). Не давать
  в условии готовый список гипотез. Не убирать «на стейдже не воспроизводится» —
  это заставляет работать с данными продакшена. Не превращать в инцидент-менеджмент
  (эскалации, коммуникации) — узел про инженерную диагностику.

trap: >-
  «Поднять ресурсы/реплики — и посмотреть»: без диагноза лечит симптом, окно может
  остаться (узкое место — БД или внешний процесс). Вторая ловушка — чинить первое
  попавшееся «медленное место» из кода, не подтвердив связь с ночным окном данными.

stack_tags: [python, postgresql, observability]

rubric:
  - id: correlate_window
    w: 0.35
    text: >-
      Начинает с картины окна сбоя: сопоставляет по времени логи с request_id, метрики
      (пул соединений, CPU/IO БД, длительности запросов) и расписание фоновых процессов
      за несколько суток, а не изучает код наугад.
  - id: hypotheses
    w: 0.25
    text: >-
      Формулирует не меньше двух проверяемых гипотез, среди них — конкурирующий фоновый
      процесс (бэкап, пересчёт, VACUUM) и исчерпание ресурса (пул соединений,
      блокировки БД).
  - id: evidence
    w: 0.25
    text: >-
      Для каждой гипотезы называет подтверждающие данные: pg_stat_activity/блокировки
      в момент окна, метрики пула, длительность и план конкретных запросов, лог фонового
      процесса с таймингами.
  - id: fix_and_verify
    w: 0.15
    text: >-
      Планирует адресный фикс под подтверждённую причину и проверку: наблюдение
      следующих окон по тем же метрикам, алерт на повтор; отвергает «долить ресурсов
      наугад» как диагноз.

anchor_variant:
  statement: |
    Сервис личного кабинета страховой компании каждый день в 03:10–03:25 отвечает
    таймаутами и 5xx примерно на треть запросов, затем сам восстанавливается. Днём всё
    стабильно, на стейдже воспроизвести не удалось. Есть: структурированные логи
    приложения с request_id, метрики процесса и PostgreSQL (CPU, IO, соединения),
    доступ к БД и к планировщику фоновых задач компании.

    Опишите план диагностики: с чего начнёте и что будете сопоставлять; какие две-три
    гипотезы проверите первыми; какие данные подтвердят или опровергнут каждую;
    как поймёте после фикса, что причина устранена. До 800 знаков.
  reference_answer: |
    Сначала собираю картину окна: по логам с request_id смотрю, какие эндпоинты
    и запросы к БД тормозят в 03:10–03:25, накладываю метрики (занятость пула
    соединений, CPU/IO БД, активные сессии) и расписание фоновых задач за неделю —
    ищу процесс, совпадающий с окном. Гипотезы: 1) ночной бэкап/пересчёт витрины
    грузит диск и вытесняет кэш БД — подтверждение: лог процесса с таймингами, рост IO
    и длительности одних и тех же запросов; 2) джоба держит блокировки или длинную
    транзакцию — подтверждение: pg_stat_activity и pg_locks в окне (снимки по cron),
    wait_event у запросов сервиса; 3) исчерпан пул соединений приложения —
    подтверждение: метрика занятых соединений у потолка и ошибки получения коннекта
    в логах. Фикс адресный: перенос/троттлинг джобы, индекс или батчи, увеличение пула —
    по подтверждённой причине. Проверка: следующие три ночных окна без 5xx по тем же
    метрикам и алерт на повтор.
  estimated_minutes: 5

