# Формат — docs/templates-spec.md. Вид: short_design (судья по рубрике, 100 %).
id: be.D1.L2.cpu_bound_in_async
node: be.D1
level: 2
kind: short_design
title: "CPU-bound операция в async-сервисе: куда вынести и какой ценой"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Модель исполнения Python: event loop однопоточный, GIL не даёт потокам ускорить
  CPU-bound код; тяжёлое вычисление выносится из цикла — в пул процессов или в отдельный
  воркер с очередью — и у каждого варианта своя цена (сериализация данных, память,
  усложнение деплоя, асинхронный ответ клиенту).

invariant: >-
  В async-сервисе есть обработчик с CPU-bound вычислением на секунды; сервис под нагрузкой
  обслуживает и другие запросы. Ответ должен назвать: почему вычисление нельзя оставить
  в цикле; почему пул потоков не решает CPU-bound (GIL); не меньше двух вариантов выноса
  с их ценой; критерий выбора и способ проверки, что задержки других запросов исчезли.

vary: >-
  Вид вычисления (хэширование файла, рендер PDF, сжатие изображения, скоринг модели),
  его длительность и частота, объём передаваемых данных, фреймворк, требования
  к синхронности ответа (ждёт клиент или можно отдать задачу в фон).

forbidden_changes: >-
  Не подсказывать в условии GIL, пул процессов и очередь задач. Не делать операцию
  IO-bound (тогда достаточно async-клиента и компромисс исчезает). Не требовать
  конкретного брокера или библиотеки — равноценные решения засчитываются. Не убирать
  из условия параллельную нагрузку от других запросов.

trap: >-
  «Вынести в пул потоков — станет параллельно»: для CPU-bound кода GIL оставляет
  один поток активным, задержки других корутин уменьшатся, но пропускная способность
  вычисления не вырастет и ядра не задействуются. Вторая ловушка — «переписать обработчик
  на async def/await ничего не меняя»: ключевое слово не делает вычисление кооперативным.

stack_tags: [python, asyncio]

rubric:
  - id: loop_and_gil
    w: 0.35
    text: >-
      Объясняет двойной механизм: вычисление в корутине блокирует event loop;
      пул потоков снимает блокировку цикла, но из-за GIL не ускоряет CPU-bound код
      и не использует ядра.
  - id: options
    w: 0.3
    text: >-
      Приводит не меньше двух рабочих вариантов выноса: пул процессов
      (run_in_executor/ProcessPoolExecutor) и отдельный воркер с очередью задач;
      для фонового варианта описывает, как клиент получает результат.
  - id: tradeoffs
    w: 0.2
    text: >-
      Называет цену вариантов: сериализация и копирование данных между процессами,
      память на воркеры, инфраструктура очереди, асинхронный ответ и усложнение клиента.
  - id: verification
    w: 0.15
    text: >-
      Предлагает проверку: нагрузочный тест с параллельными лёгкими запросами —
      p95/p99 задержки до и после выноса, загрузка ядер.

anchor_variant:
  statement: |
    Сервис электронного документооборота на FastAPI принимает загрузку документов.
    В обработчике `POST /documents` после сохранения файла строится его криптографическая
    подпись — чистое вычисление на Python, 2–4 секунды CPU на документ, библиотека
    синхронная. Загрузки идут десятками в час, но сервис параллельно обслуживает
    и лёгкие запросы чтения, и у них в моменты загрузок p99 вырастает до секунд.
    Сервер — 8 ядер, один процесс приложения.

    Спроектируйте, куда вынести вычисление подписи. Объясните: почему его нельзя оставить
    как есть; поможет ли пул потоков и почему; минимум два варианта решения с их ценой;
    какой выберете при текущих объёмах и как проверите, что задержки лёгких запросов
    исчезли. До 800 знаков.
  reference_answer: |
    Сейчас вычисление выполняется прямо в event loop: на 2–4 секунды останавливаются
    все корутины — отсюда p99 у чтения. Пул потоков (`asyncio.to_thread`) снимет
    блокировку цикла, но GIL держит активным один поток: CPU-bound код не ускорится
    и ядра простаивают; как быстрый тактический шаг годится, стратегически — нет.
    Варианты: 1) `run_in_executor(ProcessPoolExecutor)` — подпись считается в соседних
    процессах, ядра используются; цена — сериализация файла между процессами, память
    на воркеры, настройка размера пула. 2) Очередь задач (воркер-процесс, брокер):
    `POST` сохраняет документ, ставит задачу и сразу отвечает 202, статус — отдельным
    запросом или вебхуком; цена — инфраструктура брокера и асинхронный контракт
    для клиента. При десятках загрузок в час выбрал бы пул процессов — проще
    в эксплуатации; очередь — когда появятся пики или ретраи. Проверка: нагрузочный
    тест с параллельными чтениями — p99 чтения до/после и загрузка ядер.
  estimated_minutes: 5

