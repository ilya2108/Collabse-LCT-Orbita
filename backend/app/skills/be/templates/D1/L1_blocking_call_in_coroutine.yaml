# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: be.D1.L1.blocking_call_in_coroutine
node: be.D1
level: 1
kind: mcq_reasoned
title: "Синхронный вызов внутри корутины и event loop"
status: draft
author: "агент-черновик, 11 октября (W4)"

concept: >-
  Кооперативная многозадачность asyncio: event loop выполняет корутины в одном потоке
  и переключается только на await; синхронный блокирующий вызов внутри корутины
  останавливает весь цикл — страдают все запросы процесса, а не только текущий.

invariant: >-
  В async-обработчике веб-сервиса вызывается синхронная блокирующая операция
  (сетевой вызов или сон) на заметное время; вопрос — что произойдёт с остальными
  параллельными запросами. Ровно одна верная опция — «блокируется весь event loop»;
  среди неверных обязательно есть «затронут только этот запрос» и «рантайм сам
  переключит на другой поток».

vary: >-
  Предметная область сервиса (платежи, каталог, уведомления), вид блокирующего вызова
  (HTTP-клиент без async, time.sleep, драйвер БД без await), длительность, порядок опций,
  имена функций.

forbidden_changes: >-
  Не использовать в условии слова «блокирует», «однопоточный», «кооперативный» —
  они подсказывают ответ. Не заменять вызов на await-совместимый (дефект исчезнет).
  Не менять число опций (4). Не добавлять варианты про исправление — вопрос только
  про механизм (исправление — материал L2).

trap: >-
  «Затронут только текущий запрос, остальные обрабатываются параллельно» — интуиция
  из многопоточных серверов. Вторая ловушка — «Python/фреймворк заметит долгий вызов
  и сам перенесёт его в поток»: автоматического переноса нет.

stack_tags: [python, asyncio]

rubric:
  - id: event_loop_blocked
    w: 0.5
    text: >-
      Объясняет механизм: корутины выполняются в одном потоке event loop, переключение
      происходит только на await; синхронный вызов не отдаёт управление — цикл стоит.
  - id: all_requests_affected
    w: 0.3
    text: >-
      Делает следствие явным: на время вызова перестают обрабатываться все запросы
      процесса, в том числе уже начатые, растут задержки и таймауты.
  - id: no_auto_offload
    w: 0.2
    text: >-
      Отмечает, что автоматического переноса в поток нет: блокирующий код уходит из цикла
      только явно (executor/поток), иначе он выполняется прямо в цикле.

anchor_variant:
  statement: |
    Веб-сервис каталога товаров написан на FastAPI и работает в одном процессе.
    В обработчике появился вызов внешнего API курса валют через синхронную библиотеку:

    ```
    @app.get("/products/{product_id}")
    async def get_product(product_id: int):
        product = await repo.get(product_id)
        rate = currency_client.get_rate("USD")   # синхронный HTTP, ~2 секунды
        return {"id": product.id, "price_usd": product.price / rate}
    ```

    Сервис обслуживает десятки одновременных запросов, в том числе к эндпоинтам,
    где курс валют не нужен.

    Что будет происходить с остальными запросами, пока выполняется `get_rate`?

    Выберите один вариант и обоснуйте выбор в 1–2 предложениях.
  options:
    - key: A
      text: >-
        Замедлится только `GET /products/{id}` — остальные эндпоинты обрабатываются
        параллельно и не заметят вызова.
    - key: B
      text: >-
        Все запросы процесса перестанут обрабатываться до завершения вызова:
        задержка ~2 секунды появится у любого эндпоинта.
    - key: C
      text: >-
        Python обнаружит долгий вызов и автоматически выполнит его в отдельном потоке,
        поэтому задержек не будет.
    - key: D
      text: >-
        Обработчик сразу упадёт с ошибкой: синхронные вызовы внутри корутин запрещены
        интерпретатором.
  answer_key: B
  reference_answer: |
    B. Корутины выполняются в одном потоке event loop, переключение между ними происходит
    только на await. Синхронный `get_rate` не отдаёт управление циклу, поэтому на ~2
    секунды останавливается обработка всех запросов процесса — включая эндпоинты, которым
    курс не нужен. A — интуиция из многопоточных серверов, здесь поток один. C —
    автоматического переноса в поток нет, блокирующий код уходит из цикла только явно
    (run_in_executor / to_thread). D — интерпретатор такие вызовы не запрещает,
    они «просто» блокируют цикл.
  estimated_minutes: 2

