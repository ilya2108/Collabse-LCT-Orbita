# Эталонный шаблон be.B3 L1 (Слой данных, применение по образцу).
# Формат — docs/templates-spec.md. Вид: mcq_reasoned (ключ 70 %, обоснование 30 %).
id: be.B3.L1.unique_constraint
node: be.B3
level: 1
kind: mcq_reasoned
title: "Уникальность гарантирует ограничение в БД, а не проверка в коде"
status: draft
author: "эталон, 6 октября (W4)"

concept: >-
  Целостность данных на уровне СУБД: проверка «найти, затем вставить» в приложении
  не атомарна и под нагрузкой пропускает дубли; единственная надёжная гарантия
  уникальности — ограничение UNIQUE / уникальный индекс с обработкой ошибки нарушения;
  индекс без ограничения ускоряет поиск, но не ограничивает данные.

invariant: >-
  Бизнес требует уникальность значения колонки; в коде есть проверка перед вставкой;
  дубли появились под параллельной нагрузкой; у колонки есть обычный (неуникальный) индекс.
  Ровно одна опция — декларативное ограничение в БД с обработкой ошибки; неверные опции:
  «усилить» проверку в коде (транзакция/уровень изоляции без блокировок), нормализация
  значения, ускорение проверки (индекс/кэш).

vary: >-
  Предметная область и колонка (email, номер договора, SKU, промокод, логин), СУБД
  (PostgreSQL, MySQL), формулировки неверных опций (READ COMMITTED, нормализация на клиенте,
  составной индекс, кэш проверок), порядок опций.

forbidden_changes: >-
  Не употреблять в условии «гонка», «race», «атомарно», «UNIQUE». Не делать двух опций
  с ограничением в БД. Не предлагать в опциях SERIALIZABLE или SELECT … FOR UPDATE
  с блокировкой — они частично верны и делают ключ спорным. Не менять число опций.

trap: >-
  «Обернуть проверку и вставку в транзакцию» — звучит как атомарность, но READ COMMITTED
  не видит чужую незафиксированную вставку; «сделать проверку быстрее» (индекс, кэш) —
  окно между SELECT и INSERT остаётся; нормализация решает другую проблему.

stack_tags: [sql, postgresql, orm]

rubric:
  - id: race_window
    w: 0.5
    text: >-
      Объясняет окно между проверкой и вставкой: два параллельных запроса одновременно
      не находят строку и оба вставляют — проверка в приложении не атомарна.
  - id: db_guarantee
    w: 0.3
    text: >-
      Указывает, что целостность обеспечивает ограничение в БД (UNIQUE / уникальный индекс),
      а код обрабатывает ошибку нарушения уникальности и возвращает понятный ответ.
  - id: distractor_reasoning
    w: 0.2
    text: >-
      Показывает, почему транзакция в READ COMMITTED, нормализация или более быстрый индекс
      проблему не закрывают.

anchor_variant:
  statement: |
    В сервисе регистрации email пользователя должен быть уникальным. Перед вставкой код
    выполняет `SELECT 1 FROM users WHERE email = :email` и, если строки нет, делает INSERT.
    Таблица `users` создана миграцией с обычным индексом по колонке `email` (без ограничений).
    После запуска рекламной кампании в базе появились пользователи с одинаковым email —
    хотя проверка в коде никогда не отключалась.

    Какое изменение надёжно устранит дубли? Выберите один вариант и обоснуйте в 1–2
    предложениях.
  options:
    - key: A
      text: >-
        Выполнять проверку и INSERT внутри одной транзакции с уровнем изоляции
        READ COMMITTED — тогда параллельная вставка будет видна проверке.
    - key: B
      text: >-
        Добавить ограничение UNIQUE (или уникальный индекс) на колонку `email`
        и обрабатывать ошибку нарушения уникальности при вставке.
    - key: C
      text: >-
        Нормализовать email (нижний регистр, обрезка пробелов) на клиенте перед отправкой,
        чтобы проверка в коде находила совпадения.
    - key: D
      text: >-
        Заменить обычный индекс по `email` на составной `(email, created_at)`, чтобы проверка
        выполнялась быстрее и успевала до вставки.
  answer_key: B
  reference_answer: |
    B. Между SELECT и INSERT есть окно: два одновременных запроса оба не находят строку
    и оба вставляют — проверка в приложении не атомарна, и никакая её скорость этого
    не меняет. Гарантию даёт только ограничение в БД: второй INSERT завершится ошибкой
    нарушения уникальности, которую код переводит в понятный ответ (например, 409).
    Транзакция в READ COMMITTED (A) не делает чужую незафиксированную вставку видимой;
    нормализация (C) полезна сама по себе, но гонку не закрывает; более быстрый индекс (D)
    не ограничивает данные — индекс без UNIQUE лишь ускоряет поиск.
  estimated_minutes: 2

difficulty_anchor: {p_junior: 0.6, p_middle: 0.85, p_senior: 0.95}
max_time_sec: 180
max_answer_chars: 400
