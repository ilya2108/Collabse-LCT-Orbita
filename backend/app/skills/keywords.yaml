# Направления вне MVP (§5.1): need_parse/rules возвращают specialization: null и
# warning specialization_not_supported с ближайшей специализацией (nearest);
# UI предлагает «Разобрать как <nearest>». qa и devops здесь временно — до появления
# их preview-графов (8–9 октября) они перейдут в каталог специализаций.
