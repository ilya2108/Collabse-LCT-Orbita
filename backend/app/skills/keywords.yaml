# Словарь «ключевое слово → узел» для режима LLM_PROVIDER=rules (PLAN.md §5.1, §6).
#
# Правила сопоставления (app/modules/skills/service.py::match_keywords): текст приводится
# к нижнему регистру; слово из словаря совпадает с началом слова в тексте (стем «типизац»
# покрывает «типизация», «типизацию»); слова ≤ 3 символов и слова со знаками
# («c#», "ci/cd") сравниваются целиком. Веса у ключевых слов нет — важность узла
# в потребности считается по числу попаданий.
version: 1

# ключевые слова самой специализации (помимо попаданий в её узлы)
specializations:
  be: [бэкенд, бекенд, backend, серверн, server-side, микросервис, python-разработчик,
       java-разработчик, go-разработчик, api-разработ, highload]
  fe: [фронтенд, фронт-энд, frontend, react, vue, angular, вёрстк, верстк, интерфейс, spa,
       ui-разработ, web-разработчик, веб-разработчик]
  data: [данн, data engineer, data analyst, дата-инженер, аналитик данных, etl, dwh,
         хранилищ, clickhouse, pipeline, bi, дашборд]

